<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h2>👤 Quản lý tài khoản</h2>

        <!-- FORM TẠO / SỬA TÀI KHOẢN -->
        <form th:action="@{/admin/accounts/save}" method="post" class="row g-3 mb-4">
            <input type="hidden" name="maTK" th:value="${account.maTK}">
            
            <div class="col-md-4">
                <label class="form-label">Họ tên</label>
                <input type="text" name="hoTen" class="form-control" th:value="${account.hoTen}" required>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${account.email}" required>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Mật khẩu</label>
                <input type="text" name="matKhau" class="form-control" th:value="${account.matKhau}">
                <small class="text-muted">Để trống để tạo mật khẩu mặc định 123456</small>
            </div>
            
            <div class="col-md-4">
                <label class="form-label">Vai trò</label>
                <select name="vaiTro.maVT" class="form-select">
                    <option th:each="r : ${vaiTros}" th:value="${r.maVT}" th:text="${r.tenVT}"></option>
                </select>
            </div>
            
            <div class="col-12">
                <button class="btn btn-success">Lưu</button>
            </div>
        </form>

        <!-- DANH SÁCH TÀI KHOẢN -->
        <table class="table table-striped">
            <thead>
            <tr>
                <th>#</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Quyền</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${accounts}">
                <td th:text="${a.maTK}"></td>
                <td th:text="${a.hoTen}"></td>
                <td th:text="${a.email}"></td>
                <td th:text="${a.vaiTro.tenVT}"></td>
                <td><span th:text="${a.trangThai ? 'Hoạt động' : 'Khóa'}"></span></td>
                <td>
                    <a th:href="@{'/admin/accounts/edit/' + ${a.maTK}}" class="btn btn-primary btn-sm">Sửa</a>
                    
                    <form th:action="@{'/admin/accounts/' + ${a.maTK} + '/toggle-status'}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-warning btn-sm"
                                th:text="${a.trangThai ? 'Khóa' : 'Mở'}"></button>
                    </form>
                    
                    <form th:action="@{'/admin/accounts/delete/' + ${a.maTK}}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- PHÂN TRANG -->
        <nav th:if="${totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0}? 'disabled'">
                    <a class="page-link" th:href="@{/admin/accounts(page=${currentPage - 1}, size=${10})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage}? 'active'">
                    <a class="page-link" th:href="@{/admin/accounts(page=${i}, size=${10})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages}? 'disabled'">
                    <a class="page-link" th:href="@{/admin/accounts(page=${currentPage + 1}, size=${10})}">Sau</a>
                </li>
            </ul>
        </nav>

    </div>
</div>
</body>
</html>
